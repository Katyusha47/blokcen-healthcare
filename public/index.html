<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthcare Blockchain System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary" id="navbar" style="display: none;">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="bi bi-heart-pulse-fill"></i> Healthcare Blockchain
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <span class="navbar-text text-white me-3">
              <i class="bi bi-person-circle"></i> <span id="userName">User</span>
            </span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" onclick="logout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Page -->
  <div id="loginPage" class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="bi bi-heart-pulse-fill text-primary" style="font-size: 3rem;"></i>
              <h3 class="mt-3">Healthcare Blockchain</h3>
              <p class="text-muted">Secure Patient Data Management</p>
            </div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
              </button>
            </form>
            <div class="mt-3 text-center">
              <small class="text-muted">Demo: dr.smith@hospital.com / password123</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardPage" style="display: none;">
    <div class="container mt-4">
      <!-- Role-specific tabs -->
      <ul class="nav nav-tabs mb-4" id="dashboardTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="records-tab" data-bs-toggle="tab" data-bs-target="#records" type="button">
            <i class="bi bi-file-medical"></i> Medical Records
          </button>
        </li>
        <li class="nav-item" role="presentation" id="createRecordTab" style="display: none;">
          <button class="nav-link" id="create-tab" data-bs-toggle="tab" data-bs-target="#create" type="button">
            <i class="bi bi-plus-circle"></i> Create Record
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="permissions-tab" data-bs-toggle="tab" data-bs-target="#permissions" type="button">
            <i class="bi bi-shield-check"></i> Permissions
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit" type="button">
            <i class="bi bi-clock-history"></i> Audit Logs
          </button>
        </li>
      </ul>

      <div class="tab-content" id="dashboardTabContent">
        <!-- Medical Records Tab -->
        <div class="tab-pane fade show active" id="records" role="tabpanel">
          <h4>Medical Records</h4>
          <div id="recordsList"></div>
        </div>

        <!-- Create Record Tab (Doctor only) -->
        <div class="tab-pane fade" id="create" role="tabpanel">
          <h4>Create New Medical Record</h4>
          <form id="createRecordForm">
            <div class="mb-3">
              <label class="form-label">Select Patient</label>
              <select class="form-select" id="recordPatientId" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Diagnosis</label>
              <textarea class="form-control" id="recordDiagnosis" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Treatment</label>
              <textarea class="form-control" id="recordTreatment" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Medications</label>
              <textarea class="form-control" id="recordMedications" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" id="recordNotes" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save"></i> Create Record
            </button>
          </form>
        </div>

        <!-- Permissions Tab -->
        <div class="tab-pane fade" id="permissions" role="tabpanel">
          <h4>Access Permissions</h4>
          <div id="patientPermissionsSection" style="display: none;">
            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#grantAccessModal">
              <i class="bi bi-person-plus"></i> Grant Access to Doctor
            </button>
          </div>
          <div id="permissionsList"></div>
        </div>

        <!-- Audit Logs Tab -->
        <div class="tab-pane fade" id="audit" role="tabpanel">
          <h4>Audit Trail & Validation Logs</h4>
          <div id="auditLogsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Grant Access -->
  <div class="modal fade" id="grantAccessModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Grant Access to Doctor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="grantAccessForm">
            <div class="mb-3">
              <label class="form-label">Select Doctor</label>
              <select class="form-select" id="grantDoctorId" required></select>
            </div>
            <button type="submit" class="btn btn-success w-100">Grant Access</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: View Record Details -->
  <div class="modal fade" id="recordDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Medical Record Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="recordDetailContent"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
